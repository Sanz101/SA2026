<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>Sathsara Anurawa · Parking</title>
  <!-- Google Material Icons & Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap">
  <!-- Apple-style system font stack (SF Pro) fallback -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --ink: #1c1c1e;
      --ink-soft: #3a3a3c;
      --bg: #f2f2f7;
      --surface: #ffffff;
      --surface-tint: #f8f8fc;
      --line: #e5e5ea;
      --green-900: #1e2b25;
      --green-800: #2c3e33;
      --green-700: #2b5e3b;
      --green-600: #2e7d32;
      --green-500: #3f9146;
      --green-200: #cde8d0;
      --green-100: #eaf5eb;
      /* tier colors (material inspired) */
      --tier-guest: #5f7a6b;
      --tier-bike: #1f8a70;
      --tier-1000: #a86f3a;
      --tier-2000: #6b7280;
      --tier-3000: #2e7d32;
      --tier-5000: #b8860b;
      /* apple-like easing */
      --ease-ios: cubic-bezier(0.25, 0.1, 0.25, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
      --shadow-1: 0 1px 3px rgba(0,0,0,0.04), 0 2px 8px rgba(0,0,0,0.03);
      --shadow-2: 0 8px 24px rgba(0,0,0,0.06), 0 2px 6px rgba(0,0,0,0.03);
      --shadow-3: 0 20px 50px rgba(0,0,0,0.10), 0 6px 16px rgba(0,0,0,0.04);
    }
    body {
      font-family: -apple-system, 'Inter', 'SF Pro Display', 'Helvetica Neue', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      color: var(--ink);
      background-image: radial-gradient(circle at 10% 20%, rgba(46,125,50,0.05) 0%, transparent 50%);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .app-wrapper {
      max-width: 440px;
      width: 100%;
      background: var(--surface);
      border-radius: 44px;
      box-shadow: var(--shadow-3);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.6);
      backdrop-filter: blur(2px);
      transition: box-shadow 0.4s var(--ease-ios);
    }
    /* header – glassmorphism light */
    .parking-header {
      background: linear-gradient(150deg, var(--green-900) 0%, var(--green-800) 60%, var(--green-700) 100%);
      padding: 36px 24px 28px;
      color: white;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .parking-header::before {
      content: "";
      position: absolute;
      inset: -50% -20% auto auto;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(255,255,255,0.10) 0%, transparent 70%);
      pointer-events: none;
    }
    .parking-header::after {
      content: "";
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
    }
    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
    }
    .logo-image {
      height: 72px;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,0.25));
      border-radius: 18px;
    }
    .parking-header p {
      margin: 0;
      font-weight: 500;
      font-size: 0.75rem;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.8);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 20px;
      border-radius: 40px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(4px);
      position: relative;
      z-index: 1;
    }
    .parking-header p span { font-size: 1.1rem; }

    /* container & views */
    .container { background: var(--surface-tint); position: relative; }
    .view { padding: 24px 20px 32px; }
    .view.hidden { display: none; }
    .view-enter {
      animation: viewIn 0.55s var(--ease-ios) both;
    }
    @keyframes viewIn {
      0% { opacity: 0; transform: translateY(18px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ticket list */
    #ticketList { display: flex; flex-direction: column; gap: 14px; }
    .eyebrow {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: var(--ink-soft);
      opacity: 0.6;
      margin: 0 4px 16px;
    }

    /* cards – material / apple hybrid */
    .card {
      --tier: var(--green-600);
      background: var(--surface);
      border-radius: 28px;
      padding: 4px;
      box-shadow: var(--shadow-1);
      border: 1px solid var(--line);
      transition: box-shadow 0.4s var(--ease-ios), transform 0.4s var(--ease-ios), border-color 0.3s var(--ease-ios);
      opacity: 0;
      transform: translateY(12px);
      animation: cardIn 0.6s var(--ease-ios) forwards;
      will-change: transform, opacity;
    }
    @keyframes cardIn { to { opacity: 1; transform: translateY(0); } }
    .card:active { transform: scale(0.975); transition-duration: 0.1s; }
    .card-inner {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 14px 12px 12px;
      width: 100%;
      background: none;
      border: none;
      cursor: pointer;
      text-align: left;
      border-radius: 24px;
      transition: background 0.25s var(--ease-smooth);
    }
    .card-inner:hover { background: var(--green-100); }
    .card-inner:active { background: var(--green-200); }

    .tier-icon {
      flex-shrink: 0;
      width: 52px;
      height: 52px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.5rem;
      background: linear-gradient(145deg, var(--tier), color-mix(in srgb, var(--tier) 75%, #000));
      box-shadow: 0 6px 14px color-mix(in srgb, var(--tier) 35%, transparent);
    }
    .card-text { flex: 1; min-width: 0; }
    .card-text h3 {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: -0.2px;
      margin-bottom: 2px;
    }
    .card-text span {
      display: block;
      font-size: 0.78rem;
      color: var(--ink-soft);
      opacity: 0.7;
    }
    .card-arrow {
      flex-shrink: 0;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--green-100);
      color: var(--tier);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: transform 0.35s var(--ease-spring), background 0.3s var(--ease-ios), color 0.3s;
      will-change: transform;
    }
    .card-inner:hover .card-arrow {
      transform: translateX(4px) scale(1.05);
      background: var(--tier);
      color: white;
    }

    /* buttons – material design */
    .btn {
      width: 100%;
      padding: 16px 20px;
      border: none;
      border-radius: 60px;
      font-size: 1rem;
      font-family: inherit;
      font-weight: 600;
      background: var(--green-600);
      color: white;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      letter-spacing: 0.2px;
      box-shadow: 0 8px 24px rgba(46,125,50,0.25);
      transition: transform 0.3s var(--ease-spring), box-shadow 0.4s var(--ease-ios), background 0.3s var(--ease-ios);
      position: relative;
      overflow: hidden;
    }
    .btn::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg, rgba(255,255,255,0.15), transparent 60%);
      pointer-events: none;
    }
    .btn:hover { background: var(--green-700); box-shadow: 0 12px 32px rgba(46,125,50,0.30); transform: translateY(-2px); }
    .btn:active { transform: scale(0.96) translateY(0); box-shadow: 0 4px 12px rgba(46,125,50,0.20); }

    .back-btn {
      background: var(--surface);
      color: var(--ink);
      box-shadow: none;
      border: 1px solid var(--line);
      width: auto;
      padding: 10px 20px 10px 16px;
      font-size: 0.9rem;
      margin-bottom: 20px;
      transition: all 0.3s var(--ease-ios);
    }
    .back-btn:hover { background: var(--green-100); border-color: var(--green-200); box-shadow: none; transform: none; }
    .back-btn:active { transform: scale(0.96); }

    .map-btn {
      background: var(--tier, var(--green-800));
      box-shadow: 0 8px 24px color-mix(in srgb, var(--tier, var(--green-800)) 35%, transparent);
      margin-top: 8px;
    }
    .map-btn:hover { filter: brightness(0.92); box-shadow: 0 12px 32px color-mix(in srgb, var(--tier, var(--green-800)) 45%, transparent); }

    /* detail */
    .detail-eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .detail-eyebrow .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--tier, var(--green-600));
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--tier, var(--green-600)) 20%, transparent);
    }
    .detail-eyebrow span {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--ink-soft);
      opacity: 0.6;
    }
    .detail-title {
      font-family: -apple-system, 'Inter', 'SF Pro Display', serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.4px;
      margin-bottom: 20px;
    }

    /* map image with smooth load */
    .parking-sketch {
      background: var(--green-100);
      border-radius: 44px;
      margin: 0 0 18px;
      border: 1px solid var(--line);
      overflow: hidden;
      position: relative;
      aspect-ratio: 1006 / 1520;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.4), var(--shadow-1);
    }
    .parking-sketch img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: white;
      opacity: 0;
      transform: scale(1.02);
      transition: opacity 0.6s var(--ease-ios), transform 0.6s var(--ease-ios);
    }
    .parking-sketch img.loaded { opacity: 1; transform: scale(1); }
    .parking-sketch.shimmer::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,0.5) 50%, transparent 70%);
      background-size: 200% 100%;
      animation: shimmer 1.6s ease-in-out infinite;
      z-index: 1;
    }
    @keyframes shimmer { 0% { background-position: 150% 0; } 100% { background-position: -50% 0; } }
    .placeholder-img {
      width: 100%; height: 100%;
      background: var(--green-100);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--green-700);
      gap: 8px;
      font-weight: 500;
    }
    .placeholder-img span { background: rgba(255,255,255,0.5); padding: 6px 20px; border-radius: 40px; backdrop-filter: blur(2px); }

    /* contacts */
    .divider { height: 1px; background: linear-gradient(to right, transparent, var(--line), transparent); margin: 20px 0 16px; }
    .section-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .section-label span { color: var(--tier, var(--green-600)); }
    .contact-list { display: flex; flex-direction: column; gap: 10px; }
    .contact-item {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 60px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: var(--ink);
      font-weight: 500;
      transition: transform 0.3s var(--ease-spring), border-color 0.3s, background 0.3s;
      will-change: transform;
    }
    .contact-item .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--green-100);
      color: var(--tier, var(--green-600));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }
    .contact-item:hover { background: var(--green-100); border-color: var(--green-200); transform: translateX(4px); }
    .contact-item .contact-name { flex: 1; font-size: 0.92rem; }
    .contact-item .contact-phone { font-weight: 400; opacity: 0.5; font-size: 0.85rem; }

    /* toast */
    .toast-msg {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(30,30,32,0.92);
      backdrop-filter: blur(12px);
      color: white;
      padding: 14px 28px;
      border-radius: 60px;
      font-weight: 500;
      font-size: 0.95rem;
      box-shadow: 0 16px 48px rgba(0,0,0,0.25);
      z-index: 999;
      opacity: 0;
      transition: opacity 0.4s var(--ease-ios), transform 0.4s var(--ease-ios);
      pointer-events: none;
      white-space: nowrap;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .toast-msg.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 380px) {
      .logo-image { height: 56px; }
      .parking-header { padding: 28px 16px 20px; }
      .detail-title { font-size: 1.5rem; }
    }
    /* material symbol fallback */
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0; }
  </style>
</head>
<body>
<div class="app-wrapper">
  <header class="parking-header">
    <div class="logo-container">
      <img src="logo.png" alt="Sathsara Anurawa Logo" class="logo-image">
    </div>
    <p><span class="material-symbols-outlined">local_parking</span> Choose your parking</p>
  </header>

  <div class="container" id="appContainer">
    <!-- HOME -->
    <div id="homeView" class="view">
      <div class="eyebrow">Available areas</div>
      <div id="ticketList"></div>
    </div>

    <!-- DETAIL -->
    <div id="detailView" class="view hidden">
      <button class="btn back-btn" id="backHomeBtn"><span class="material-symbols-outlined" style="font-size:1.1rem;">arrow_back</span> Back</button>
      <div class="detail-eyebrow">
        <span class="dot" id="detailDot"></span>
        <span id="detailBadge">Parking area</span>
      </div>
      <div class="detail-title" id="detailTitle">Parking</div>

      <div class="parking-sketch shimmer" id="sketchPlaceholder">
        <img id="mapImage" src="image.png" alt="Parking Location Map">
      </div>

      <button class="btn map-btn" id="mapBtn"><span class="material-symbols-outlined">map</span> Open in Google Maps</button>

      <div class="divider"></div>
      <div class="section-label"><span class="material-symbols-outlined">call</span> Contacts</div>
      <div id="contactsContainer" class="contact-list"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast-msg"></div>

<script>
  (function() {
    // ----- UPDATED DATA with new numbers and locations -----
    const data = {
      guest: {
        map: "https://maps.app.goo.gl/RuQyv5ZiUZzTkzu47",
        image: "guest.png",
        contacts: [
          { name: "Tharusha", phone: "0760771317" },
          { name: "Chamika", phone: "0703813879" }
        ],
        label: "Invitees · Senate",
        sub: "Senate building",
        icon: "group",
        tier: "guest"
      },
      bike: {
        map: "https://maps.app.goo.gl/2rnaTknQF6FTZWBcA",
        image: "Bike Only.png",
        contacts: [
          { name: "Yoonus", phone: "0770308670" },
          { name: "Sahan", phone: "0784678282" }
        ],
        label: "Bike Parking",
        sub: "PGIHS",
        icon: "two_wheeler",
        tier: "bike"
      },
      1000: {
        map: "https://maps.app.goo.gl/d57uozVDLoibWh2s6",
        image: "D.png",
        contacts: [
          { name: "Ashara", phone: "0703139797" },
          { name: "Thamindu", phone: "0710512717" }
        ],
        label: "1000 Parking",
        sub: "JRDC",
        icon: "directions_car",
        tier: "1000"
      },
      2000: {
        map: "https://maps.app.goo.gl/d57uozVDLoibWh2s6",
        image: "C.png",
        contacts: [
          { name: "Dananjaya", phone: "0704344425" },
          { name: "Dilanja", phone: "0760731929" }
        ],
        label: "2000 Parking",
        sub: "JRDC",
        icon: "directions_car",
        tier: "2000"
      },
      3000: {
        map: "https://maps.app.goo.gl/sLDjWJqhJX26a6CB7",
        image: "B.png",
        contacts: [
          { name: "Keminda", phone: "0767630319" },
          { name: "Sankar", phone: "0719748851" }
        ],
        label: "3000 Parking",
        sub: "Kannangara building",
        icon: "star",
        tier: "3000"
      },
      5000: {
        map: "https://maps.app.goo.gl/BHmYTWVW6siYrWXV6",
        image: "A.png",
        contacts: [
          { name: "Dinel", phone: "0765922495" },
          { name: "Pawan", phone: "0767257677" }
        ],
        label: "5000 Parking",
        sub: "Gemba canteen · premium",
        icon: "crown",
        tier: "5000"
      }
    };

    const displayOrder = ['guest', 'bike', '1000', '2000', '3000', '5000'];

    const homeView = document.getElementById('homeView');
    const detailView = document.getElementById('detailView');
    const ticketList = document.getElementById('ticketList');
    const detailTitle = document.getElementById('detailTitle');
    const detailBadge = document.getElementById('detailBadge');
    const detailDot = document.getElementById('detailDot');
    const sketchPlaceholder = document.getElementById('sketchPlaceholder');
    const mapImage = document.getElementById('mapImage');
    const contactsContainer = document.getElementById('contactsContainer');
    const mapBtn = document.getElementById('mapBtn');
    const backBtn = document.getElementById('backHomeBtn');
    const toast = document.getElementById('toast');

    let currentKey = null;
    let toastTimer = null;

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function tierVar(tier) { return `var(--tier-${tier})`; }

    function buildHome() {
      ticketList.innerHTML = '';
      displayOrder.forEach((key, i) => {
        const ticket = data[key];
        if (!ticket) return;
        const card = document.createElement('div');
        card.className = 'card';
        card.style.setProperty('--tier', tierVar(ticket.tier));
        card.style.animationDelay = `${0.05 + i * 0.06}s`;
        card.innerHTML = `
          <button class="card-inner select-btn" data-key="${key}">
            <span class="tier-icon"><span class="material-symbols-outlined">${ticket.icon}</span></span>
            <span class="card-text">
              <h3>${ticket.label}</h3>
              <span>${ticket.sub}</span>
            </span>
            <span class="card-arrow"><span class="material-symbols-outlined">chevron_right</span></span>
          </button>
        `;
        ticketList.appendChild(card);
      });

      document.querySelectorAll('.select-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const key = this.getAttribute('data-key');
          if (key) showDetail(key);
        });
      });
    }

    function showDetail(key) {
      currentKey = key;
      const ticket = data[key];
      if (!ticket) return;

      const tierColor = tierVar(ticket.tier);
      detailView.style.setProperty('--tier', tierColor);

      detailTitle.textContent = ticket.label;
      detailBadge.textContent = ticket.sub;

      sketchPlaceholder.classList.add('shimmer');
      mapImage.classList.remove('loaded');
      mapImage.style.display = 'block';

      const existingFallback = sketchPlaceholder.querySelector('.placeholder-img');
      if (existingFallback) existingFallback.remove();
      if (!sketchPlaceholder.contains(mapImage)) sketchPlaceholder.appendChild(mapImage);

      const finishLoad = () => {
        sketchPlaceholder.classList.remove('shimmer');
        mapImage.classList.add('loaded');
      };

      mapImage.onload = finishLoad;
      mapImage.onerror = function() {
        sketchPlaceholder.classList.remove('shimmer');
        this.style.display = 'none';
        const fallback = document.createElement('div');
        fallback.className = 'placeholder-img';
        fallback.innerHTML = `
          <span class="material-symbols-outlined" style="font-size:3rem; opacity:0.4;">map</span>
          <span>Map location</span>
          <span style="font-size:0.65rem; opacity:0.5; background:transparent;">${ticket.label}</span>
        `;
        sketchPlaceholder.appendChild(fallback);
      };
      // trigger load
      mapImage.src = "image.png";
      if (mapImage.complete && mapImage.naturalWidth > 0) finishLoad();

      // Contacts
      contactsContainer.innerHTML = '';
      ticket.contacts.forEach((c, i) => {
        const a = document.createElement('a');
        a.className = 'contact-item';
        a.style.opacity = '0';
        a.style.animation = `cardIn 0.45s var(--ease-ios) ${0.15 + i * 0.07}s forwards`;
        a.href = `tel:${c.phone}`;
        a.innerHTML = `
          <span class="avatar"><span class="material-symbols-outlined">person</span></span>
          <span class="contact-name">${c.name}</span>
          <span class="contact-phone"><span class="material-symbols-outlined" style="font-size:0.9rem; vertical-align:middle;">phone</span> ${c.phone}</span>
        `;
        contactsContainer.appendChild(a);
      });

      mapBtn.onclick = function() {
        if (currentKey && data[currentKey]) {
          window.open(data[currentKey].map, '_blank');
          showToast(`Opening ${data[currentKey].label} in Google Maps`);
        } else {
          showToast('Location not available');
        }
      };

      homeView.classList.add('hidden');
      detailView.classList.remove('hidden');
      detailView.classList.remove('view-enter');
      void detailView.offsetWidth;
      detailView.classList.add('view-enter');
    }

    function goHome() {
      detailView.classList.add('hidden');
      homeView.classList.remove('hidden');
      homeView.classList.remove('view-enter');
      void homeView.offsetWidth;
      homeView.classList.add('view-enter');
      currentKey = null;
    }

    backBtn.addEventListener('click', goHome);
    buildHome();
  })();
</script>
</body>
</html>
